services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civicmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicmind_dev_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-civicmind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicmind_user} -d ${POSTGRES_DB:-civicmind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: civicmind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
    name: civicmind_postgres_data
  redis_data:
    name: civicmind_redis_data
